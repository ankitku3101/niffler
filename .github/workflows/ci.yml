name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Only the logic that holds no connections. The check-* scripts need a database and live
      # Groq and Razorpay credentials, so they stay manual rather than running on every push.
      - run: npm test
